<svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full leading-none markmap mm-w63pkd-1" style=""><style>.markmap{--markmap-max-width: 9999px;--markmap-a-color: #0097e6;--markmap-a-hover-color: #00a8ff;--markmap-code-bg: #f0f0f0;--markmap-code-color: #555;--markmap-highlight-bg: #ffeaa7;--markmap-table-border: 1px solid currentColor;--markmap-font: 300 16px/20px sans-serif;--markmap-circle-open-bg: #fff;--markmap-text-color: #333;--markmap-highlight-node-bg: #ff02;font:var(--markmap-font);color:var(--markmap-text-color)}.markmap-link{fill:none}.markmap-node&gt;circle{cursor:pointer}.markmap-foreign{display:inline-block}.markmap-foreign p{margin:0}.markmap-foreign a{color:var(--markmap-a-color)}.markmap-foreign a:hover{color:var(--markmap-a-hover-color)}.markmap-foreign code{padding:.25em;font-size:calc(1em - 2px);color:var(--markmap-code-color);background-color:var(--markmap-code-bg);border-radius:2px}.markmap-foreign pre{margin:0}.markmap-foreign pre&gt;code{display:block}.markmap-foreign del{text-decoration:line-through}.markmap-foreign em{font-style:italic}.markmap-foreign strong{font-weight:700}.markmap-foreign mark{background:var(--markmap-highlight-bg)}.markmap-foreign table,.markmap-foreign th,.markmap-foreign td{border-collapse:collapse;border:var(--markmap-table-border)}.markmap-foreign img{display:inline-block}.markmap-foreign svg{fill:currentColor}.markmap-foreign&gt;div{width:var(--markmap-max-width);text-align:left}.markmap-foreign&gt;div&gt;div{display:inline-block}.markmap-highlight rect{fill:var(--markmap-highlight-node-bg)}.markmap-dark .markmap{--markmap-code-bg: #1a1b26;--markmap-code-color: #ddd;--markmap-circle-open-bg: #444;--markmap-text-color: #eee}</style><g transform="translate(24.180195468538386,340.6915668413871) scale(0.33050313230760875)"><path class="markmap-link" data-depth="3" data-path="1.2.3" d="M925,10.875C965,10.875,965,244.188,1005,244.188" stroke-width="1.375" stroke="rgb(148, 103, 189)"/><path class="markmap-link" data-depth="2" data-path="1.2" d="M351,11.25C391,11.25,391,10.875,431,10.875" stroke-width="1.75" stroke="rgb(255, 127, 14)"/><g class="markmap-highlight"/><g data-depth="3" data-path="1.2.3" class="markmap-node" transform="translate(1005, -243.5)"><line stroke="#9467bd" stroke-width="1.375" x1="-1" x2="691" y1="487.6875" y2="487.6875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="673" height="487"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml"><pre data-lines="9,34"><code class="language-text">1. Маршрутизация IP-пакетов и DNS
├── 1.1. Базовая адресация (IP)
│   ├── IP-адрес: Уникальный числовой идентификатор устройства в сети.
│   └── IPv4: 
│       ├── Формат: 32-битный адрес (4 октета от 0.0.0.0 до 255.255.255.255).
│       └── Ограничение: ~4,3 млрд адресов (решается через NAT и IPv6).
├── 1.2. Сетевая инфраструктура
│   ├── Хост (Host): Конечное устройство в сети (ПК, телефон, сервер).
│   ├── Гейтвей / Шлюз (Gateway): Устройство (роутер), связывающее разные сети.
│   ├── Сеть (Network): Объединенная группа устройств с общим диапазоном IP.
│   └── Подсеть (Subnet): Логический сегмент сети с маской подсети (напр. /24).
├── 1.3. Процесс маршрутизации
│   ├── IP-пакет: Заголовок (IP отправителя/получателя) + данные.
│   └── Таблица маршрутизации (Routing Table):
│       └── База правил на роутере: Сеть назначения, Шлюз, Интерфейс, Метрика.
└── 1.4. Система доменных имен (DNS)
    ├── DNS-сервер: Преобразует имена (yandex.ru) в IP-адреса.
    └── Записи DNS:
        ├── A: Связывает имя с IPv4.
        ├── AAAA: Связывает имя с IPv6.
        ├── CNAME: Перенаправляет домен на другой домен (алиас).
        ├── MX: Указывает почтовый сервер домена.
        ├── NS: Указывает на авторитетный DNS-сервер.
        └── TXT: Служебный текст (защита почты SPF/DKIM).# cybersecurity-hw1</code></pre></div></div></foreignObject></g><g data-depth="2" data-path="1.2" class="markmap-node" transform="translate(431, -10)"><line stroke="#ff7f0e" stroke-width="1.75" x1="-1" x2="496" y1="20.875" y2="20.875"/><circle stroke-width="1.5" r="6" stroke="#ff7f0e" fill="var(--markmap-circle-open-bg)" cx="494" cy="20.875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="478" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">Задание 1. Интеллект-карта «Маршрутизация IP-пакетов и DNS»</div></div></foreignObject></g><g data-depth="1" data-path="1" class="markmap-node" transform="translate(0, -10)"><line stroke="#1f77b4" stroke-width="2.5" x1="-1" x2="353" y1="21.25" y2="21.25"/><circle stroke-width="1.5" r="6" stroke="#1f77b4" fill="var(--markmap-circle-open-bg)" cx="351" cy="21.25"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="335" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">Работы по дисциплине «Кибербезопасность»</div></div></foreignObject></g></g></svg>